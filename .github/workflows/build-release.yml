name: Build signed APK and publish release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: antithefthelper-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEYSTORE_PATH: /tmp/antitheft-release.keystore
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force
          LATEST_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"

          if [[ -z "$LATEST_TAG" ]]; then
            MAJOR=0
            MINOR=1
          elif [[ "$LATEST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"

            # Simple automatic release sequence:
            # 0.1.0 -> 0.2.0 -> ... -> 0.9.0 -> 1.0.0 -> 1.1.0 -> ...
            if (( MINOR >= 9 )); then
              MAJOR=$((MAJOR + 1))
              MINOR=0
            else
              MINOR=$((MINOR + 1))
            fi
          else
            echo "Latest release tag has an unsupported format: $LATEST_TAG"
            exit 1
          fi

          VERSION_NAME="${MAJOR}.${MINOR}.0"
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          TAG_NAME="v${VERSION_NAME}"
          RELEASE_NAME="AntiTheftHelper ${VERSION_NAME}"

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=$RELEASE_NAME" >> "$GITHUB_ENV"

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

          {
            echo "### Automatic release version"
            echo ""
            echo "- Previous tag: ${LATEST_TAG:-none}"
            echo "- New version: ${VERSION_NAME}"
            echo "- Android versionCode: ${VERSION_CODE}"
            echo "- Release tag: ${TAG_NAME}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle with persistent cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      - name: Validate signing secrets
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD"; exit 1; }
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "Computed versionCode must be an integer"; exit 1; }

      - name: Decode release keystore
        shell: bash
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

      - name: Build signed release APK
        shell: bash
        run: |
          gradle --no-daemon --build-cache --parallel :app:assembleRelease \
            -PVERSION_NAME="$VERSION_NAME" \
            -PVERSION_CODE="$VERSION_CODE"

      - name: Prepare release files
        id: files
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || { echo "Signed APK not found at $APK"; find app/build/outputs -maxdepth 6 -type f || true; exit 1; }
          OUT="AntiTheftHelper-${TAG_NAME}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "${OUT}.sha256"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "checksum=${OUT}.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        shell: bash
        run: |
          APK="${{ steps.files.outputs.apk }}"
          CHECKSUM="${{ steps.files.outputs.checksum }}"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$APK" "$CHECKSUM" --clobber
            gh release edit "$TAG_NAME" --title "$RELEASE_NAME"
          else
            gh release create "$TAG_NAME" "$APK" "$CHECKSUM" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_NAME" \
              --generate-notes
          fi
