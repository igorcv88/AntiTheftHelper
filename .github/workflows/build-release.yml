name: Build signed APK and publish release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: App version name (for example 0.1.0)
        required: true
        default: "0.1.0"
        type: string
      version_code:
        description: Integer Android version code
        required: true
        default: "1"
        type: string
      tag_name:
        description: Git tag / release tag (for example v0.1.0)
        required: true
        default: "v0.1.0"
        type: string
      release_name:
        description: GitHub Release title
        required: true
        default: "AntiTheftHelper 0.1.0"
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEYSTORE_PATH: /tmp/antitheft-release.keystore
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}
      TAG_NAME: ${{ inputs.tag_name }}
      RELEASE_NAME: ${{ inputs.release_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate signing secrets
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD"; exit 1; }
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "version_code must be an integer"; exit 1; }

      - name: Decode release keystore
        shell: bash
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

      - name: Build signed release APK
        shell: bash
        run: |
          gradle --no-daemon :app:assembleRelease \
            -PVERSION_NAME="$VERSION_NAME" \
            -PVERSION_CODE="$VERSION_CODE"

      - name: Prepare release files
        id: files
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || { echo "Signed APK not found at $APK"; find app/build/outputs -maxdepth 6 -type f || true; exit 1; }
          OUT="AntiTheftHelper-${TAG_NAME}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "${OUT}.sha256"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "checksum=${OUT}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntiTheftHelper-${{ inputs.tag_name }}
          path: |
            ${{ steps.files.outputs.apk }}
            ${{ steps.files.outputs.checksum }}
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: bash
        run: |
          APK="${{ steps.files.outputs.apk }}"
          CHECKSUM="${{ steps.files.outputs.checksum }}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$APK" "$CHECKSUM" --clobber
            gh release edit "$TAG_NAME" --title "$RELEASE_NAME"
          else
            gh release create "$TAG_NAME" "$APK" "$CHECKSUM" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_NAME" \
              --generate-notes
          fi
